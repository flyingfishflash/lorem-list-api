# Kotlin's JVM target compiler ceiling (JVM_23 as of Kotlin 2.1.20) trails the project's Java
# release target (25) during the Kotlin -> Java migration. Both bytecode versions run fine on the
# JDK 26 toolchain; downgrade the mismatch check from a hard error to a warning until all Kotlin
# sources are gone and this plugin/property is removed.
kotlin.jvm.target.validation.mode=warning
